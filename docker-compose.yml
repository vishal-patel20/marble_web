version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: marble_postgres_db
    restart: always
    environment:
      POSTGRES_USER: marble_user
      POSTGRES_PASSWORD: marble_secure_password
      POSTGRES_DB: marble_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - marble_network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: marble_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=db
      - DB_USER=marble_user
      - DB_PASSWORD=marble_secure_password
      - DB_NAME=marble_db
      - DB_PORT=5432
      - JWT_SECRET=super_secret_jwt_sign_key_987654321
      - JWT_REFRESH_SECRET=super_secret_jwt_refresh_sign_key_123456789
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - CLOUDINARY_CLOUD_NAME=mock_cloud
      - CLOUDINARY_API_KEY=mock_key
      - CLOUDINARY_API_SECRET=mock_secret
    depends_on:
      - db
    networks:
      - marble_network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: marble_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - marble_network

volumes:
  postgres_data:

networks:
  marble_network:
    driver: bridge
